{% load static %}

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mealmotion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/7e94103858.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- Navigation -->
  {% include 'navbar.html' %}
  <!-- Main Content -->
  {% block content %}
  {% endblock %}
  <!-- Footer -->
  <footer class="navbar fixed-bottom bg-body-tertiary shadow-sm py-3">
    <div
      class="container d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start gap-3">
      <div>
        <small>© 2025 Mealmotion. All rights reserved.</small>
      </div>
      <div class="text-center">
        <strong class="d-block mb-1">Customer Service</strong>
        <ul class="list-unstyled mb-0">
          <li><a href="#" class="text-reset text-decoration-none">How it works</a></li>
          <li><a href="#" class="text-reset text-decoration-none">Orders</a></li>
        </ul>
      </div>
      <div class="text-center">
        <strong class="d-block mb-1">Stay Connected</strong>
        <div class="mb-2">
          <a href="https://en-gb.facebook.com/"><i class="fa-brands fa-facebook me-2"></i></a>
          <a href="https://www.instagram.com/"><i class="fa-brands fa-instagram me-2"></i></a>
          <a href="https://x.com/"><i class="fa-brands fa-x-twitter"></i></a>
          <a href="https://www.threads.com/"><i class="fa-brands fa-threads"></i></a>
        </div>
        <form class="d-flex justify-content-center justify-content-md-end">
          <input class="form-control form-control-sm me-2" type="email" placeholder="Email" aria-label="Email">
          <button class="btn btn-outline-success btn-sm" type="submit">Subscribe</button>
        </form>
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
