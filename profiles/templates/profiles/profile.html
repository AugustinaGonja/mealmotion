{% extends 'base.html' %}
{% load static %}

{% block extra_css %}

{% endblock %}

{% block content %}
<main class="py-4">
    <div class="container">
        <div class="row gy-4"> 

            <h3 class="text-uppercase text-start mt-4">My Profile</h3>
            <h4>Hello, {{ profile }}</h4>

            <!-- Left Column -->
            <div class="col-12 col-md-4"> 
                <div class="d-flex flex-column mb-4 p-3 bg-white shadow-sm rounded">
                    <p class="fw-bold text-start text-uppercase mb-3">Delivery Information</p>

                    <!-- Profile Form -->
                    <form method="POST" action="{% url 'profile' %}" id="profile-info">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <button type="submit" class="btn w-100 rounded-1 fn-shop text-uppercase mt-3">
                            Update Profile
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-12 col-md-8">
                <div class="d-flex flex-column mb-4 p-3 bg-white shadow-sm rounded">
                    <p class="fw-bold text-start text-uppercase mb-3">Order History</p>
                    {{ orders }}
                </div>

                <div class="d-flex flex-column mb-4 p-3 bg-white shadow-sm rounded">
                    <p class="fw-bold mb-0">Payment Information</p>
                </div>
            </div>

        </div>
    </div>     
</main>

<style>
    .form-group, .mb-3, .mb-4, .form-control {
        margin-bottom: 1.5rem !important;
    }
</style>
{% endblock %}
